[project]
name = "clausa-fractal-ai-backend"
version = "1.0.0"
description = "ClausaFractalAI Backend: Autonomous Legal Document Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "google-genai>=0.1.0",
    "google-cloud-aiplatform>=1.60.0",
    "pypdf>=4.3.0",
    "pdfplumber>=0.11.0",
    "faiss-cpu>=1.8.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "bandit[toml]>=1.7.9",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".pytest_cache",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "ANN", # flake8-annotations
    "D",   # pydocstyle
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D203",   # 1 blank line required before class docstring
    "D213",   # Multi-line docstring summary should start at the second line
    "B008",   # Do not perform function call in argument defaults (FastAPI File/Form/Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN"]
"tests/**/*" = ["S101", "D", "ANN"]
"scripts/*" = ["S101", "D", "ANN", "E402"]
"src/main.py" = ["E402"]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --cov=src --cov-branch --cov-fail-under=100 --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
