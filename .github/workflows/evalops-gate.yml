name: Continuous EvalOps Quality Gate

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # Nightly continuous verification

jobs:
  golden-dataset-benchmark:
    name: 52-Case Golden Dataset Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Golden Dataset Evaluator
        run: python tests/eval/run_evals.py
