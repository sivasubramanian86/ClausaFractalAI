name: ClausaFractalAI Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # ── Gate 0: Secret Leak Prevention ──────────────────────────────────────────
  security-audit:
    name: Gitleaks & Secret Credential Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  # ── Gate 1: Backend Quality ──────────────────────────────────────────────────
  backend-verification-gates:
    name: Backend Lint, Security & 100% Coverage Gate
    runs-on: ubuntu-latest
    needs: security-audit
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff bandit pytest pytest-asyncio pytest-cov httpx firebase-admin google-cloud-firestore google-cloud-bigquery

      - name: Ruff Linter Check
        run: ruff check src/ tests/ scripts/

      - name: Ruff Code Formatting Check
        run: ruff format --check src/ tests/ scripts/

      - name: Bandit AST Security Audit
        run: bandit -r src/ -c pyproject.toml

      - name: Execute Pytest Suite with 100% Coverage Gate
        run: pytest tests/ -v --cov=src --cov-branch --cov-fail-under=100

      - name: Execute 10-Case Golden Hallucination Benchmark
        run: python scripts/evaluate_hallucinations.py

  # ── Gate 2: Frontend Quality ─────────────────────────────────────────────────
  frontend-verification-gates:
    name: Frontend TypeScript, 100% Coverage & Production Build Gate
    runs-on: ubuntu-latest
    needs: security-audit
    defaults:
      run:
        working-directory: ./frontend
    env:
      VITE_FIREBASE_API_KEY: "mock-api-key-ci"
      VITE_FIREBASE_AUTH_DOMAIN: "clausafractalai.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "clausafractalai"
      VITE_FIREBASE_STORAGE_BUCKET: "clausafractalai.appspot.com"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:mockappid"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run type-check

      - name: Run Vitest Suite with High-Density Coverage Enforcement
        run: npx vitest run --coverage --coverage.thresholds.statements=95 --coverage.thresholds.branches=88 --coverage.thresholds.functions=90 --coverage.thresholds.lines=95

      - name: Verify Production Bundle Build
        run: npm run build

  # ── Gate 3: Playwright E2E + WCAG Accessibility ──────────────────────────────
  e2e-accessibility-gates:
    name: Playwright E2E GUI & WCAG Accessibility Audit
    runs-on: ubuntu-latest
    needs: [backend-verification-gates, frontend-verification-gates]
    defaults:
      run:
        working-directory: ./frontend
    env:
      CI: true
      VITE_FIREBASE_API_KEY: "mock-api-key-ci"
      VITE_FIREBASE_AUTH_DOMAIN: "clausafractalai.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "clausafractalai"
      VITE_FIREBASE_STORAGE_BUCKET: "clausafractalai.appspot.com"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:mockappid"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests (including WCAG ARIA checks)
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
