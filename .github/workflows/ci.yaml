name: ClausaFractalAI CI/CD Quality Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret & Credential Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  backend-quality-gates:
    name: Python Lint, Bandit Security & 100% Coverage Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pytest pytest-asyncio pytest-cov httpx pydantic pydantic-settings fastapi sse-starlette

      - name: Ruff Linter Check
        run: ruff check src/ tests/

      - name: Ruff Code Formatting Check
        run: ruff format --check src/ tests/

      - name: Bandit AST Security Audit
        run: bandit -r src/ -c pyproject.toml

      - name: Execute Pytest Suite with 100% Coverage Gate
        run: pytest tests/ -v --cov=src --cov-branch --cov-fail-under=100
