name: DevSecOps CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-sec-scan:
    name: Ruff & Security Governance Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit[toml] -r requirements.txt

      - name: Run Ruff Linting
        run: python -m ruff check app/ tests/

      - name: Run Bandit Security Vulnerability Scan
        run: python -m bandit -r app/ -c backend/pyproject.toml || true

  backend-tests:
    name: Hermetic Pytest (100% Target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run App Unit & Integration Tests
        run: python -m pytest tests/ -v
