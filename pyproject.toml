[project]
name = "clausafractalai"
version = "2.0.0"
description = "ClausaFractalAI: Enterprise Neuro-Symbolic Agent Mesh for Autonomous Legal Intelligence & Formal Verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "z3-solver>=5.1.0.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "google-cloud-trace>=1.14.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".pytest_cache",
    "dist",
    "build",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "ANN", # flake8-annotations
    "D",   # pydocstyle
]
ignore = [
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
    "ANN401", # Dynamically typed expressions (typing.Any)
    "D100",   # Missing docstring in public module (for tests)
    "D104",   # Missing docstring in public package
    "D203",   # 1 blank line required before class docstring (conflicts D211)
    "D213",   # Multi-line docstring summary should start at the second line
    "B008",   # FastAPI File/Form/Depends in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN", "E501"]
"tests/**/*" = ["S101", "D", "ANN", "E501"]
"tests/eval/*" = ["E501", "F841", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "app"]
